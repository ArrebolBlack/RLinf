# RLOPT shared-infra speed template: 100K env steps with process8 workers.
# Reuses the RLE-U1 frozen instrumentation line (5e4ed6e9/267e1140) without
# changing the learner semantics: identical env/reward/state contracts, only
# the execution topology and budget differ.  Defaults here are the RLE-U1
# recommended recipe (n8/e8/u4/b1024/pageable_cpu/process8).
#
# Keep --rlinf-commit, --benchmark-commit, --output, and optional --resume on
# the CLI.  Set task/seed/manifest seeds per arm.  This is a speed arm; every
# speed arm must also pass the frozen validation contract (>= 8 episodes) and
# consume hash-pinned best policies.
task: null
algorithm: residual_rlpd
seed: 1
num_envs: 8
eval_num_envs: 8
demo_num_envs: 8
env_worker_threads: 1
eval_worker_threads: 1
env_worker_processes: 8
eval_worker_processes: 8
eval_planner_in_processes: true
persistent_eval_workers: true
borrow_training_env_for_eval: false
sampler_learner_overlap: true
process_start_method: spawn
total_env_steps: 100000
random_env_steps: 5000
demo_episodes: 64
demo_max_attempts: 640
demo_ratio: 0.5
bc_steps: 5000
batch_size: 1024
replay_capacity: 250000
replay_storage: pageable_cpu
non_blocking_copy: false
updates_per_vector_step: 4
timing_sample_interval: 50
q_heads: 10
q_target_subset: 2
gamma: 0.99
tau: 0.005
actor_lr: 0.0003
actor_bc_weight: 100.0
residual_scale: 0.25
reward_safety_penalty: -10.0
critic_lr: 0.0003
alpha_lr: 0.0003
initial_alpha: 0.01
target_entropy: -7.0
eval_interval: 10000
eval_episodes: 40
checkpoint_interval: 10000
log_interval: 1000
train_manifest_seed: 20261050
validation_manifest_seed: 20261150
manifest_size: 4096
image_size: 64

# Optional shared-infra sections; omit for a pure speed baseline.
features: {}
reward_components: {}
