# RLOPT-SO3 shared-infra example recipe (initial recommendation only).
# Final weights/feature choices belong to the RLOPT-SO3 environment agent.
# Keep --rlinf-commit, --benchmark-commit, --output, and optional --resume on
# the CLI.  Every arm must use seed-paired RLE1 manifests (s1=20262050/20262150).
task: t1_so3
algorithm: residual_rlpd
seed: 1
num_envs: 2
eval_num_envs: 2
total_env_steps: 20000
random_env_steps: 2000
demo_episodes: 16
demo_max_attempts: 160
demo_ratio: 0.5
bc_steps: 2000
batch_size: 512
replay_capacity: 250000
updates_per_vector_step: 1
q_heads: 10
q_target_subset: 2
gamma: 0.99
tau: 0.005
actor_lr: 0.0003
actor_bc_weight: 100.0
residual_scale: 0.25
reward_safety_penalty: -10.0
critic_lr: 0.0003
alpha_lr: 0.0003
initial_alpha: 0.01
target_entropy: -7.0
eval_interval: 10000
eval_episodes: 8
checkpoint_interval: 10000
log_interval: 1000
train_manifest_seed: 20262050
validation_manifest_seed: 20262150
manifest_size: 1024
image_size: 64

# Shared RLOPT infra: current-state derived features (no future oracle).
features:
  relative_pose: true
  geodesic_error: true
  object_vel: true
  ee_vel: true
  relative_vel: true
  time_to_goal: true
  stage: true
  action_history:
    k: 3
  goal_error: true

# Shared RLOPT infra: dense reward components (weight 0 disables a component).
reward_components:
  r_ori_geodesic:
    weight: 2.0
    scale_rad: 0.5
  r_rel_pose:
    weight: 1.0
    scale_pos_m: 0.05
    scale_rot_rad: 0.5
  r_stage:
    weight: 1.0
