# RLE-U1 utilization-bakeoff reference recipe.
# Keep source commits, demo cache, output, and optional resume explicit on the CLI.
# Candidate configs may change only the documented utilization fields.
task: t4_sphere
algorithm: residual_rlpd
seed: 1
num_envs: 2
eval_num_envs: 2
demo_num_envs: 2
env_worker_threads: 1
eval_worker_threads: 1
env_worker_processes: 0
eval_worker_processes: 0
process_start_method: spawn
total_env_steps: 20000
random_env_steps: 5000
demo_episodes: 64
demo_max_attempts: 640
demo_ratio: 0.5
bc_steps: 5000
batch_size: 512
replay_capacity: 250000
replay_storage: pageable_cpu
non_blocking_copy: false
updates_per_vector_step: 1
timing_sample_interval: 20
q_heads: 10
q_target_subset: 2
gamma: 0.99
tau: 0.005
actor_lr: 0.0003
actor_bc_weight: 100.0
residual_scale: 1.0
reward_safety_penalty: -10.0
critic_lr: 0.0003
alpha_lr: 0.0003
initial_alpha: 0.01
target_entropy: -7.0
eval_interval: 10000
eval_episodes: 40
checkpoint_interval: 10000
log_interval: 1000
train_manifest_seed: 20263050
validation_manifest_seed: 20262150
manifest_size: 1024
image_size: 64
