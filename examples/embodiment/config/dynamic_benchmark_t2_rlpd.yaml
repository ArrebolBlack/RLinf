# Dynamic Benchmark T2 RLPD reference recipe.
# Keep --rlinf-commit, --benchmark-commit, --output, and optional --resume on the CLI.
task: t2_trans
algorithm: rlpd
seed: 1
num_envs: 2
eval_num_envs: 2
total_env_steps: 200000
random_env_steps: 2000
demo_episodes: 32
demo_max_attempts: 320
demo_ratio: 0.5
bc_steps: 5000
batch_size: 512
replay_capacity: 250000
updates_per_vector_step: 4
q_heads: 10
q_target_subset: 2
gamma: 0.99
tau: 0.005
actor_lr: 0.0003
actor_bc_weight: 0.0
critic_lr: 0.0003
alpha_lr: 0.0003
initial_alpha: 0.01
target_entropy: -7.0
eval_interval: 10000
eval_episodes: 16
checkpoint_interval: 10000
log_interval: 1000
train_manifest_seed: 20261050
validation_manifest_seed: 20261150
manifest_size: 4096
image_size: 64
