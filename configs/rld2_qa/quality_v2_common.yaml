# RLD2-QA Cycle-1 common recipe.  The metric bundle is evaluated at export time;
# this optional training term only discourages high-frequency arm-action changes
# using the previous applied action, never future state.
reward_components:
  r_action_rate:
    weight: 0.10
    scale: 1.0

# Keep an explicit short action history available for task-specific Cycle-2
# arms.  It is masked until the history exists and therefore preserves reset
# correctness.
features:
  action_history:
    k: 3
