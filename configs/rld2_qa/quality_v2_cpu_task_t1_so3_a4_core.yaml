# Current-source CPU-environment recovery recipe for t1_so3.
#
# This is the current common recipe plus the complete observation core of the
# historical RLOPT-SO3 A4 winner.  It deliberately preserves the current
# action-rate/action-history additions, so it needs matched current-source
# confirmation before it can be called a reproduced winner.
algorithm: residual_rlpd
num_envs: 2
eval_num_envs: 2
demo_num_envs: 2
total_env_steps: 20000
random_env_steps: 2000
demo_episodes: 16
demo_max_attempts: 160
demo_ratio: 0.5
bc_steps: 2000
batch_size: 512
replay_capacity: 250000
updates_per_vector_step: 1
q_heads: 10
q_target_subset: 2
actor_bc_weight: 100.0
initial_alpha: 0.01
eval_interval: 2000
eval_episodes: 8
checkpoint_interval: 2000
validation_manifest_seed: 20261450
residual_scale: 0.25
reward_safety_penalty: -10.0

state_derived_feature:
  - eef_to_object_pose_wxyz
  - eef_to_object_distance_m
  - fingerpad_midpoint_world
  - grasp_point_offset_world_m
  - closing_axis_object_alignment_rad
  - object_vertical_position_m
  - eef_vertical_position_m
  - object_yaw_rad
  - object_xy_velocity_m_s
  - object_angular_velocity_z_rad_s

reward_components:
  r_action_rate:
    weight: 0.10
    scale: 1.0

features:
  action_history:
    k: 3
