# RLD2-QA Cycle-2 arm A for T2-SE3 placement instability.
#
# This arm was predeclared after the Cycle-1 seed-1 failure cluster (7/8 at an
# intermediate checkpoint, 0/8 at 20K) and before the N0 recovery seeds are
# inspected.  It exposes only current observation features and penalizes current
# goal-orientation error plus past-action rate; it never consumes release metrics
# or future state.  The object-in-EEF `r_rel_pose` term is intentionally omitted:
# its zero-centred translation is not the task's frozen pregrasp transform.
residual_scale: 0.20

reward_components:
  r_action_rate:
    weight: 0.15
    scale: 1.0
  r_ori_geodesic:
    weight: 0.25
    scale_rad: 0.50
  r_completion_shaping:
    weight: 0.25
    near_threshold: 0.80
    scale: 1.0

features:
  action_history:
    k: 3
  geodesic_error: {}
  goal_error: {}

