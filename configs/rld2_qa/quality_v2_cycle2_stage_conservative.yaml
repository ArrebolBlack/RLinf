# RLD2-QA Cycle-2 arm B for T3 phase/progress regressions that remain after
# quality_v2_cycle2_stage.yaml.  It changes only two predeclared controls:
# a smaller planner-residual envelope and a stronger past-action-rate penalty.
# Run this arm only if the first stage arm fails frozen validation; never choose
# between the arms using final-test or Owner review examples.
residual_scale: 0.125

reward_components:
  r_action_rate:
    weight: 0.20
    scale: 1.0
  r_stage:
    weight: 0.50

features:
  action_history:
    k: 3
  stage: {}
