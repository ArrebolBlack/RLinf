# CPU production residual-RLPD recipe for the eleven non-special exact-14 tasks.
# Run identity, source commits, output paths, task, and seed stay explicit on the
# launcher CLI and are deliberately forbidden from this frozen recipe.
algorithm: residual_rlpd
num_envs: 32
eval_num_envs: 8
demo_num_envs: 2
total_env_steps: 20000
random_env_steps: 2000
demo_episodes: 16
demo_max_attempts: 160
demo_ratio: 0.5
bc_steps: 2000
batch_size: 512
replay_capacity: 250000
updates_per_vector_step: 16
q_heads: 10
q_target_subset: 2
actor_bc_weight: 100.0
initial_alpha: 0.01
eval_interval: 2000
eval_episodes: 8
checkpoint_interval: 2000
validation_manifest_seed: 20261450
residual_scale: 0.25
reward_safety_penalty: -10.0

reward_components:
  r_action_rate:
    weight: 0.10
    scale: 1.0

features:
  action_history:
    k: 3
